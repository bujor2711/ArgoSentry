; VolkDMA Configuration File
; This file allows runtime configuration of VolkDMA library settings

; ============================================================================
; FPGA Settings
; ============================================================================
[FPGA]
; FPGA algorithm to use (0 = default)
algorithm = 0

; Minimum FPGA version requirements
min_version_major = 4
min_version_major_alt = 5
min_version_minor = 7

; ============================================================================
; Signature Scanning Settings
; ============================================================================
[Scanning]
; Chunk size for signature scanning (in bytes)
; Default: 1048576 (1MB)
; Larger chunks = faster scanning but more memory usage
; Smaller chunks = slower scanning but less memory usage
chunk_size = 1048576

; ============================================================================
; Memory Operation Settings
; ============================================================================
[Memory]
; Maximum safe read size (in bytes)
; Default: 2147483648 (2GB)
; Protects against overflow and excessive memory allocation
max_safe_read_size = 2147483648

; ============================================================================
; Performance Metrics Settings
; ============================================================================
[Metrics]
; Enable or disable performance metrics collection
; true = collect metrics (small performance overhead)
; false = disable metrics (maximum performance)
enabled = true

; ============================================================================
; Logging Settings
; ============================================================================
[Logging]
; Log level: debug, info, warn, error
; debug = all messages
; info = informational and higher
; warn = warnings and errors only
; error = errors only
level = info

; ============================================================================
; Usage Examples
; ============================================================================
; 
; Load this configuration:
;   DMAConfiguration& config = DMAConfiguration::get_instance();
;   config.load_from_file("volkdma.ini");
;
; Change settings at runtime:
;   config.set_scan_chunk_size(2 * 1024 * 1024); // 2MB chunks
;   config.set_metrics_enabled(false); // Disable metrics
;
; Save current settings:
;   config.save_to_file("volkdma_custom.ini");
